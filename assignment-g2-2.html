<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>A test page</title>
    <!-- Note: In order to keep things simple for this assignment, I have used the 
    style element below. The convention is to have the CSS in a separate file. -->
    <style>
        .site-button {
            background-color: purple;
            color: white;
            font-size: 150%;
            margin: 1em;
            padding: 0.5em;
        }
        .rotating-button {
            transition: scale 0.5s, rotate 0.5s;
        }
        .rotating-button:hover{
            background-color: white;
            color: purple;
            scale: 1.2

        }
        .rotating-button:active {
            rotate:180deg;
        }

    </style>
  </head>
  <body>
    <button class="site-button rotating-button">
        😀
        <br>
        Click me!
    </button>
    <br>
    <button class="site-button"">
      A normal ordinary button.
    </button>
  </body>
</html>
